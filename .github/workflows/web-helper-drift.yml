name: Web helper drift
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find the newest main build
        id: build
        run: |
          found=$(gh api "repos/$GH_REPO/actions/artifacts?name=batbox-ubuntu-24.04&per_page=50" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")] | first | "\(.workflow_run.id) \(.workflow_run.head_sha)"')
          if [[ -z $found || $found == null* ]]; then
            echo "::error::No batbox-ubuntu-24.04 artifact from main to test; push to main or re-run Indigenous platform builds."
            exit 1
          fi
          read -r run sha <<<"$found"
          echo "run=$run" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Testing main at $sha (Indigenous platform builds run $run)"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.sha }}
      - name: Linux dependencies
        uses: ./.github/actions/linux-dependencies
      - name: Batbox from that build
        env:
          RUN_ID: ${{ steps.build.outputs.run }}
        run: |
          gh run download "$RUN_ID" --name batbox-ubuntu-24.04 --dir "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP"/package/batbox-ubuntu-24.04.tar.gz -C "$RUNNER_TEMP/package"
          install -m 755 "$RUNNER_TEMP"/package/batbox-*/bin/batbox "$RUNNER_TEMP/batbox"
          "$RUNNER_TEMP/batbox" --version
      - name: Connector probe
        run: |
          cmake --preset indigenous -DBUILD_TESTING=ON
          cmake --build build/indigenous --target batbox-connectors --parallel 4
      - name: uv
        run: pipx install uv
      - name: Drift check
        run: |
          python3 checks/web_helper_drift.py --batbox "$RUNNER_TEMP/batbox" \
            --connectors build/indigenous/batbox-connectors 2>&1 | tee "$RUNNER_TEMP/drift.log"
      - name: Open or update the drift issue
        if: failure()
        env:
          SHA: ${{ steps.build.outputs.sha }}
        run: |
          title="Web helper drift detected"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The web helper drift check failed on $(date -u +%F) for main at ${SHA:-an unknown commit}: $run_url"
            echo
            echo '````'
            if [[ -s $RUNNER_TEMP/drift.log ]]; then tail -n 80 "$RUNNER_TEMP/drift.log" | cut -c1-600
            else echo "The drift check did not start; see the run log for the failing step."; fi
            echo '````'
          } >"$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -n $number ]]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
